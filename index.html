<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Accra Life 3D - The Sims of Ghana</title>
    <meta name="description" content="Experience Accra's vibrant city life! Explore Osu Bloom Bar, East Legon, Labadi Beach, customize royal Kente drip, hustle gigs, and party in full 3D.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="src/game/style.css">

    <!-- Google AdSense H5 Games Integration (pub-3985878289597879) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3985878289597879" crossorigin="anonymous"></script>

    <!-- Paystack Mobile Money & Card Checkout -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <style>
        /* Auth Modal Specific Styling */
        .auth-form-group {
            margin-bottom: 14px;
        }
        .auth-form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .auth-input {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
        }
        .auth-input:focus {
            border-color: #38bdf8;
        }
        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: rgba(15, 23, 42, 0.5);
            padding: 4px;
            border-radius: 12px;
        }
        .auth-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 8px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
        .auth-tab-btn.active {
            background: #0284c7;
            color: #fff;
        }
        .auth-message {
            font-size: 0.82rem;
            margin-top: 10px;
            text-align: center;
        }
        .auth-message.success { color: #34d399; }
        .auth-message.error { color: #f87171; }
    </style>
</head>
<body>
    <!-- 3D Hardware Accelerated WebGL Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Glassmorphic Game HUD (Generated dynamically by UIManager) -->
    <div id="game-hud"></div>

    <!-- Interactive In-Game Rewarded Video Ad Player Modal -->
    <div id="ad-player-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center; max-width: 420px;">
            <div style="font-size: 2rem; margin-bottom: 6px;">🎬</div>
            <h3 id="ad-player-title">📺 Sponsored Video Offer</h3>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Watch this short video to claim your in-game reward!</p>

            <div style="background: radial-gradient(circle, #1e293b 0%, #020617 100%); border: 1px solid #334155; border-radius: 14px; height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 18px 0;">
                <div style="font-size: 2.4rem; margin-bottom: 6px;">🇬🇭 ✨</div>
                <div id="ad-player-timer" style="font-size: 1.6rem; font-weight: 800; color: #38bdf8;">6s</div>
                <div style="font-size: 0.75rem; color: #64748b; margin-top: 6px;">Google AdSense H5 Verified Sponsor</div>
            </div>

            <button id="ad-player-claim-btn" class="btn-ad-multiplier" style="display: none;">
                🎁 Claim Reward!
            </button>
        </div>
    </div>

    <!-- Firebase Authentication & Cloud Save Modal -->
    <div id="auth-modal" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('open')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>👤 Alvyd Player Account & Cloud Save</h3>
                <button class="modal-close-btn" onclick="document.getElementById('auth-modal').classList.remove('open')">✕</button>
            </div>

            <!-- Profile View (When Logged In) -->
            <div id="auth-profile-view" style="display: none;">
                <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px;">
                    <div style="width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); display: flex; align-items: center; justify-content: center; font-size: 1.6rem;">👑</div>
                    <div>
                        <div id="profile-username" style="font-size: 1.1rem; font-weight: 800;">@Kwame</div>
                        <div id="profile-meta" style="font-size: 0.8rem; color: #94a3b8;">player@accralife.com</div>
                    </div>
                </div>

                <button class="btn-submit" style="margin-bottom: 10px;" onclick="window.syncCloudSave()">
                    ☁️ Save Progress to Cloud Firestore
                </button>
                <button class="btn-standard" style="margin-bottom: 10px;" onclick="window.restoreCloudSave()">
                    📥 Restore Cloud Save to Game
                </button>
                <button class="btn-standard" style="color: #f87171;" onclick="window.handleSignOut()">
                    Sign Out
                </button>
            </div>

            <!-- Form View (When Logged Out) -->
            <div id="auth-form-view">
                <div class="auth-tabs">
                    <button id="tab-login-btn" class="auth-tab-btn active" onclick="window.switchAuthTab('login')">Sign In</button>
                    <button id="tab-signup-btn" class="auth-tab-btn" onclick="window.switchAuthTab('signup')">Create Account</button>
                </div>

                <form onsubmit="event.preventDefault(); window.handleAuthSubmit();">
                    <div class="auth-form-group" id="group-username" style="display: none;">
                        <label>Username</label>
                        <input id="auth-username" class="auth-input" type="text" placeholder="e.g. AccraBaller">
                    </div>

                    <div class="auth-form-group">
                        <label>Email Address</label>
                        <input id="auth-email" class="auth-input" type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="auth-form-group">
                        <label>Password</label>
                        <input id="auth-password" class="auth-input" type="password" placeholder="••••••••" required>
                    </div>

                    <button id="auth-submit-btn" class="btn-submit" type="submit">Sign In</button>
                    <div id="auth-msg" class="auth-message"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules (Official Firestore & Auth) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { gameState } from './src/game/state.js';

        const firebaseConfig = {
            projectId: "alvyd-7c69d",
            appId: "1:950214032279:web:94fbf914c37fe1cb1ce2d2",
            storageBucket: "alvyd-7c69d.firebasestorage.app",
            apiKey: "AIzaSyDz5dphp7PWCTyM7zSW1Ah5eFAmklsr3qo",
            authDomain: "alvyd-7c69d.firebaseapp.com",
            messagingSenderId: "950214032279"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let currentUserProfile = null;
        let authMode = 'login';

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                try {
                    const snap = await getDoc(doc(db, "users", user.uid));
                    if (snap.exists()) {
                        currentUserProfile = snap.data();
                        document.getElementById('profile-username').textContent = `@${currentUserProfile.username}`;
                        document.getElementById('profile-meta').textContent = `${user.email}`;
                    }
                } catch(e) {
                    console.warn('Profile fetch error:', e);
                }
                document.getElementById('auth-profile-view').style.display = 'block';
                document.getElementById('auth-form-view').style.display = 'none';
            } else {
                currentUserProfile = null;
                document.getElementById('auth-profile-view').style.display = 'none';
                document.getElementById('auth-form-view').style.display = 'block';
            }
        });

        window.switchAuthTab = (mode) => {
            authMode = mode;
            const loginBtn = document.getElementById('tab-login-btn');
            const signupBtn = document.getElementById('tab-signup-btn');
            const groupUser = document.getElementById('group-username');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (mode === 'signup') {
                loginBtn.classList.remove('active');
                signupBtn.classList.add('active');
                groupUser.style.display = 'block';
                submitBtn.textContent = 'Create Account';
            } else {
                signupBtn.classList.remove('active');
                loginBtn.classList.add('active');
                groupUser.style.display = 'none';
                submitBtn.textContent = 'Sign In';
            }
        };

        window.handleAuthSubmit = async () => {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const username = document.getElementById('auth-username').value.trim() || 'Player';
            const msg = document.getElementById('auth-msg');

            msg.className = 'auth-message';
            msg.textContent = 'Processing...';

            try {
                if (authMode === 'signup') {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", cred.user.uid), {
                        username,
                        email,
                        createdAt: serverTimestamp()
                    });
                    msg.className = 'auth-message success';
                    msg.textContent = `Welcome to Accra Life, @${username}!`;
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    msg.className = 'auth-message success';
                    msg.textContent = 'Signed in successfully!';
                }
                setTimeout(() => document.getElementById('auth-modal').classList.remove('open'), 1000);
            } catch(e) {
                msg.className = 'auth-message error';
                msg.textContent = e.message || 'Authentication error';
            }
        };

        window.handleSignOut = async () => {
            await signOut(auth);
            document.getElementById('auth-modal').classList.remove('open');
        };

        window.syncCloudSave = async () => {
            if (!currentUser) {
                alert("Please sign in or create an account to save your progress.");
                return;
            }
            try {
                await setDoc(doc(db, "saves", currentUser.uid), {
                    uid: currentUser.uid,
                    saveData: JSON.stringify(gameState.data),
                    cedis: gameState.data.cedis,
                    clout: gameState.data.clout,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                alert(`✨ Game progress saved to Cloud Firestore!\nWallet: ₵${gameState.data.cedis} Cedis`);
            } catch(e) {
                alert('Error syncing save: ' + e.message);
            }
        };

        window.restoreCloudSave = async () => {
            if (!currentUser) return;
            try {
                const snap = await getDoc(doc(db, "saves", currentUser.uid));
                if (snap.exists() && snap.data().saveData) {
                    gameState.data = JSON.parse(snap.data().saveData);
                    gameState.save();
                    alert(`📥 Cloud save restored successfully!\nWallet: ₵${gameState.data.cedis} Cedis`);
                    document.getElementById('auth-modal').classList.remove('open');
                } else {
                    alert('No cloud save found for this account.');
                }
            } catch(e) {
                alert('Error restoring save: ' + e.message);
            }
        };
    </script>

    <!-- Master Game Application Entry Point -->
    <script type="module" src="src/game/main.js"></script>
</body>
</html>
