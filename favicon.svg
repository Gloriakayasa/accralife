<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Radial Glow Behind Star -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Diamond Frame -->
  <g filter="url(#shadow)">
    <polygon points="256,64 432,256 256,448 80,256" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="256,92 404,256 256,420 108,256" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.7"/>
  </g>

  <!-- Golden 5-Pointed Accra Star -->
  <polygon points="
    256,146
    288,222
    370,227
    306,278
    328,358
    256,312
    184,358
    206,278
    142,227
    224,222
  " fill="url(#goldGrad)" filter="url(#shadow)"/>

  <!-- Star Core Accent -->
  <polygon points="
    256,180
    275,232
    332,236
    288,271
    303,326
    256,294
    209,326
    224,271
    180,236
    237,232
  " fill="#fef08a" opacity="0.6"/>
</svg>
